name: Verify runnable source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: emsolver_test
          POSTGRES_USER: emsolver_test
          # Disposable CI database only; no production credentials are used.
          POSTGRES_PASSWORD: ci-database-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emsolver_test -d emsolver_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      EMSOLVER_TEST_DATABASE_URL: postgresql://emsolver_test:ci-database-only@127.0.0.1:5432/emsolver_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-cluster.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock -c requirements-cluster.lock '.[server,worker]'
      - name: Frontend tests and build
        run: |
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
      - name: Backend tests including real PostgreSQL
        run: python -m pytest -q
      - name: Delivery structure and executable sample
        run: python scripts/check_delivery.py --require-build
