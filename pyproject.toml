[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emsolver-workbench"
version = "0.9.0"
description = "Observable sparse Hermitian eigensolver workbench"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.18", "psutil>=6,<8", "PyYAML>=6,<7", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
server = ["psycopg[binary]>=3.2,<4"]
worker = ["httpx>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
metal = ["mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
local-ai = ["mlx-lm==0.32.1; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
emsolver = "emsolver.cli:main"

[tool.setuptools.packages.find]
include = ["emsolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
