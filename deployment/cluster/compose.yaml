name: emsolver-team
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: emsolver
      POSTGRES_USER: emsolver
      POSTGRES_PASSWORD: ${EMSOLVER_POSTGRES_PASSWORD:?Run configure_cluster.py first}
    ports:
      - "127.0.0.1:${EMSOLVER_PG_PORT:-15483}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emsolver -d emsolver"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: deployment/cluster/Dockerfile
    image: emsolver-team:local
    restart: unless-stopped
    user: "${EMSOLVER_UID:-1000}:${EMSOLVER_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EMSOLVER_EXECUTION_MODE: cluster
      EMSOLVER_DATA_DIR: /data/instance
      EMSOLVER_DATABASE_URL: postgresql://emsolver:${EMSOLVER_POSTGRES_PASSWORD}@postgres:5432/emsolver
      EMSOLVER_DATABASE_SCHEMA: emsolver
      EMSOLVER_IDENTITIES_FILE: /run/emsolver/identities.json
      EMSOLVER_CLUSTER_VALIDATION_SLOTS: "1"
    ports:
      - "127.0.0.1:${EMSOLVER_API_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - ./private/identities.json:/run/emsolver/identities.json:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
volumes:
  postgres-data:
